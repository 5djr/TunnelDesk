<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:"
    />
    <title>TunnelDesk</title>
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div class="app">
      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="sidebar-brand">
          <div class="brand-icon">
            <img src="./favicon.png" width="20" height="20" alt="" draggable="false" />
          </div>
          <span class="brand-name">TunnelDesk</span>
        </div>

        <button
          class="nav-new-btn"
          id="quick-connect"
          title="Quick Connect (Ctrl+Shift+O)"
        >
          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          >
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />
          </svg>
          Quick Connect
        </button>
        <button class="nav-new-btn" id="new-connection">
          <svg
            width="14"
            height="14"
            viewBox="0 0 14 14"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          >
            <line x1="7" y1="1" x2="7" y2="13" />
            <line x1="1" y1="7" x2="13" y2="7" />
          </svg>
          New Tunnel
        </button>

        <!-- Search -->
        <div class="sidebar-search">
          <svg
            class="search-icon"
            width="12"
            height="12"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="11" cy="11" r="8" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
          </svg>
          <input
            type="text"
            class="search-input"
            id="search-input"
            placeholder="Search tunnels…"
            autocomplete="off"
            spellcheck="false"
          />
        </div>

        <div class="sidebar-section-label">Tunnels</div>

        <div class="sidebar-list" id="sidebar-list"></div>

        <!-- Sidebar footer: Settings -->
        <div class="sidebar-footer">
          <button class="sidebar-settings-btn" id="settings-btn">
            <svg
              width="13"
              height="13"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="3" />
              <path
                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
              />
            </svg>
            Settings
          </button>
        </div>
      </aside>

      <!-- Sidebar resize handle -->
      <div class="sidebar-resize-handle" id="sidebar-resize-handle"></div>

      <!-- Main -->
      <div class="main">
        <div class="update-banner hidden" id="update-banner">
          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <polyline points="17 1 21 5 17 9" />
            <path d="M3 11V9a4 4 0 0 1 4-4h14" />
            <polyline points="7 23 3 19 7 15" />
            <path d="M21 13v2a4 4 0 0 1-4 4H3" />
          </svg>
          <span id="update-banner-text"></span>
          <a
            id="update-banner-link"
            class="update-banner-link"
            href="#"
            target="_blank"
            rel="noopener"
            >Download</a
          >
          <button
            class="update-banner-dismiss"
            id="update-banner-dismiss"
            aria-label="Dismiss"
          >
            &#xD7;
          </button>
        </div>

        <div class="deps-warning hidden" id="deps-warning">
          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path
              d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"
            />
            <line x1="12" y1="9" x2="12" y2="13" />
            <line x1="12" y1="17" x2="12.01" y2="17" />
          </svg>
          <span id="deps-warning-text"></span>
          <button
            class="deps-warning-dismiss"
            id="deps-warning-dismiss"
            aria-label="Dismiss warning"
          >
            &times;
          </button>
        </div>

        <div class="policy-banner hidden" id="policy-banner">
          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
          </svg>
          <span id="policy-banner-text"></span>
        </div>

        <div class="detail-panel" id="detail-panel"></div>

        <div class="log-resize-handle" id="log-resize-handle"></div>
        <div class="log-panel">
          <div class="log-header">
            <span>Activity</span>
            <button class="log-clear" id="log-clear">Clear</button>
          </div>
          <div class="log-body" id="activity-log">
            <div class="log-empty">No activity yet.</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- Add/Edit Modal -->
    <div class="modal-overlay hidden" id="form-modal">
      <div class="modal">
        <div class="modal-header">
          <h2 class="modal-title" id="form-title">New Tunnel</h2>
          <button class="modal-close" id="cancel-save" aria-label="Close">
            <svg
              width="12"
              height="12"
              viewBox="0 0 12 12"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            >
              <line x1="1" y1="1" x2="11" y2="11" />
              <line x1="11" y1="1" x2="1" y2="11" />
            </svg>
          </button>
        </div>
        <form id="save-form" novalidate>
          <input type="hidden" id="connection-id" />
          <div class="form-group">
            <label class="form-label" for="protocol">Protocol</label>
            <select class="form-input" id="protocol">
              <optgroup label="Cloudflare Access">
                <option value="rdp-cf">RDP via Cloudflare Access</option>
                <option value="ssh-cf">SSH via Cloudflare Access</option>
              </optgroup>
              <optgroup label="Direct">
                <option value="rdp">RDP (Direct)</option>
                <option value="ssh">SSH (Direct)</option>
                <option value="telnet">Telnet</option>
                <option value="http">HTTP</option>
                <option value="https">HTTPS</option>
              </optgroup>
            </select>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="friendly-name">Display Name</label>
              <input
                class="form-input"
                type="text"
                id="friendly-name"
                placeholder="e.g. Corp RDP"
                autocomplete="off"
              />
            </div>
            <div class="form-group">
              <label class="form-label" for="conn-group"
                >Group <span class="form-optional">optional</span></label
              >
              <input
                class="form-input"
                type="text"
                id="conn-group"
                placeholder="e.g. Production"
                autocomplete="off"
              />
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="hostname"
              >Hostname <span class="form-required">*</span></label
            >
            <input
              class="form-input"
              type="text"
              id="hostname"
              placeholder="rdp.example.com"
              autocomplete="off"
            />
          </div>
          <div class="form-group">
            <label class="form-label" for="port">Port</label>
            <input
              class="form-input"
              type="number"
              id="port"
              value="3389"
              min="1"
              max="65535"
            />
          </div>
          <div class="form-section-label">
            Credentials <span class="form-optional">optional</span>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="cred-username">Username</label>
              <input
                class="form-input"
                type="text"
                id="cred-username"
                placeholder="e.g. Administrator"
                autocomplete="off"
              />
            </div>
            <div class="form-group">
              <label class="form-label" for="cred-password">Password</label>
              <div class="form-input-reveal-wrap">
                <input
                  class="form-input"
                  type="password"
                  id="cred-password"
                  placeholder="••••••••"
                  autocomplete="new-password"
                />
                <button
                  type="button"
                  class="input-reveal-btn"
                  id="toggle-password"
                  title="Show/hide password"
                  tabindex="-1"
                >
                  <svg
                    width="14"
                    height="14"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="M1 12S5 4 12 4s11 8 11 8-4 8-11 8S1 12 1 12z" />
                    <circle cx="12" cy="12" r="3" />
                  </svg>
                </button>
              </div>
            </div>
          </div>
          <!-- SSH key — shown only for ssh / ssh-cf protocols -->
          <div class="form-group" id="ssh-key-group" style="display: none">
            <label class="form-label" for="ssh-key-path"
              >SSH Key File <span class="form-optional">optional</span></label
            >
            <div class="form-file-row">
              <input
                class="form-input"
                type="text"
                id="ssh-key-path"
                placeholder="e.g. ~/.ssh/id_rsa"
                autocomplete="off"
                readonly
              />
              <button type="button" class="btn btn-secondary btn-sm" id="ssh-key-browse">
                Browse
              </button>
              <button
                type="button"
                class="btn btn-ghost btn-sm"
                id="ssh-key-clear"
                title="Clear key"
              >
                &times;
              </button>
            </div>
            <label class="form-label" for="ssh-key-passphrase" style="margin-top: 10px"
              >Key Passphrase <span class="form-optional">optional</span></label
            >
            <div class="form-input-reveal-wrap">
              <input
                class="form-input"
                type="password"
                id="ssh-key-passphrase"
                placeholder="Leave empty if key has no passphrase"
                autocomplete="new-password"
              />
              <button
                type="button"
                class="input-reveal-btn"
                id="toggle-passphrase"
                title="Show/hide passphrase"
                tabindex="-1"
              >
                <svg
                  width="14"
                  height="14"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M1 12S5 4 12 4s11 8 11 8-4 8-11 8S1 12 1 12z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
          </div>
          <!-- Jump host — shown only for ssh / ssh-cf protocols -->
          <div class="form-group" id="jump-host-group" style="display: none">
            <div class="form-section-label">
              Jump Host / Bastion <span class="form-optional">optional</span>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label class="form-label" for="jump-host">Jump Host</label>
                <input
                  class="form-input"
                  type="text"
                  id="jump-host"
                  placeholder="e.g. bastion.example.com"
                  autocomplete="off"
                />
              </div>
              <div class="form-group" style="max-width: 120px">
                <label class="form-label" for="jump-port">Port</label>
                <input
                  class="form-input"
                  type="number"
                  id="jump-port"
                  value="22"
                  min="1"
                  max="65535"
                />
              </div>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="conn-notes"
              >Notes <span class="form-optional">optional</span></label
            >
            <textarea
              class="form-input form-textarea"
              id="conn-notes"
              placeholder="e.g. Dev server — ask John for access"
              rows="2"
              autocomplete="off"
            ></textarea>
          </div>
          <div class="form-actions">
            <button type="button" class="btn btn-ghost" id="cancel-save-bottom">
              Cancel
            </button>
            <button type="submit" class="btn btn-primary">Save Tunnel</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Confirm Delete Modal -->
    <div class="modal-overlay hidden" id="confirm-modal">
      <div class="modal modal-confirm">
        <div class="confirm-icon">
          <svg
            width="22"
            height="22"
            viewBox="0 0 22 22"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="11" cy="11" r="9" />
            <line x1="11" y1="7" x2="11" y2="11" />
            <line x1="11" y1="15" x2="11.01" y2="15" />
          </svg>
        </div>
        <h2 class="modal-title">Delete Tunnel</h2>
        <p class="confirm-message" id="confirm-message">
          Are you sure you want to delete this tunnel?
        </p>
        <div class="form-actions">
          <button class="btn btn-ghost" id="confirm-cancel">Cancel</button>
          <button class="btn btn-danger" id="confirm-ok">Delete</button>
        </div>
      </div>
    </div>

    <!-- Quick Connect Modal -->
    <div class="modal-overlay hidden" id="quick-connect-modal">
      <div class="modal" style="max-width: 420px">
        <div class="modal-header">
          <h2 class="modal-title">Quick Connect</h2>
          <button class="modal-close" id="qc-cancel-top" aria-label="Close">
            <svg
              width="12"
              height="12"
              viewBox="0 0 12 12"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            >
              <line x1="1" y1="1" x2="11" y2="11" />
              <line x1="11" y1="1" x2="1" y2="11" />
            </svg>
          </button>
        </div>
        <form id="qc-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="qc-protocol">Protocol</label>
            <select class="form-input" id="qc-protocol">
              <option value="ssh">SSH (Direct)</option>
              <option value="telnet">Telnet</option>
              <option value="ssh-cf">SSH via Cloudflare Access</option>
            </select>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="qc-host"
                >Host <span class="form-required">*</span></label
              >
              <input
                class="form-input"
                type="text"
                id="qc-host"
                placeholder="hostname or IP"
                autocomplete="off"
              />
            </div>
            <div class="form-group" style="max-width: 100px">
              <label class="form-label" for="qc-port">Port</label>
              <input
                class="form-input"
                type="number"
                id="qc-port"
                value="22"
                min="1"
                max="65535"
              />
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="qc-user">Username</label>
              <input class="form-input" type="text" id="qc-user" autocomplete="off" />
            </div>
            <div class="form-group">
              <label class="form-label" for="qc-pass">Password</label>
              <input
                class="form-input"
                type="password"
                id="qc-pass"
                placeholder="••••••••"
                autocomplete="new-password"
              />
            </div>
          </div>
          <div class="form-actions">
            <button type="button" class="btn btn-ghost" id="qc-cancel">Cancel</button>
            <button type="submit" class="btn btn-primary">Connect</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Terminal-only window root — visible only in ?mode=terminal windows -->
    <div id="term-window-root" class="term-window-root hidden"></div>

    <!-- Form window root — visible only in ?mode=form windows -->
    <div id="form-window-root" class="form-window-root hidden"></div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
