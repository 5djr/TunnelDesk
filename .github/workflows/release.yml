name: Build & Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows (MSI + EXE)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # cpu-features is an optional native addon inside ssh2. Skip it so the
      # Electron V8 native rebuild does not fail in CI. ssh2 falls back to
      # pure-JS crypto detection when cpu-features is absent.
      - name: Install dependencies
        run: npm ci --ignore-optional

      - name: Build renderer
        run: npm run build:renderer

      - name: Package Windows
        run: npx electron-builder --win --x64

      - name: Upload Windows artifacts
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          files: |
            dist-app/*.msi
            dist-app/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    name: Linux (AppImage + deb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-optional

      - name: Install Linux build tools
        run: sudo apt-get update && sudo apt-get install -y fakeroot dpkg

      - name: Build renderer
        run: npm run build:renderer

      - name: Package Linux
        run: npx electron-builder --linux --x64

      - name: Upload Linux artifacts
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          files: |
            dist-app/*.AppImage
            dist-app/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-mac:
    name: macOS (DMG + ZIP)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-optional

      - name: Build renderer
        run: npm run build:renderer

      - name: Package macOS
        run: npx electron-builder --mac

      - name: Upload macOS artifacts
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          files: |
            dist-app/*.dmg
            dist-app/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
