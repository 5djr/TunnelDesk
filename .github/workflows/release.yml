name: Build & Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows (MSI + EXE)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # cpu-features is an optionalDependency of ssh2 whose nan bindings are
      # incompatible with Electron 42 V8. Deleting it before electron-builder
      # runs prevents the native rebuild failure; ssh2 falls back to pure JS.
      - name: Remove cpu-features (incompatible with Electron 42 V8)
        run: Remove-Item -Recurse -Force node_modules/cpu-features -ErrorAction SilentlyContinue
        shell: pwsh

      - name: Build renderer
        run: npm run build:renderer

      - name: Package Windows
        run: npx electron-builder --win --x64 --publish=never

      - name: Upload Windows artifacts
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          files: |
            dist-app/*.msi
            dist-app/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    name: Linux (AppImage + deb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Remove cpu-features (incompatible with Electron 42 V8)
        run: rm -rf node_modules/cpu-features

      - name: Install Linux build tools
        run: sudo apt-get update && sudo apt-get install -y fakeroot dpkg

      - name: Build renderer
        run: npm run build:renderer

      - name: Package Linux
        run: npx electron-builder --linux --x64 --publish=never

      - name: Upload Linux artifacts
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          files: |
            dist-app/*.AppImage
            dist-app/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-mac:
    name: macOS (DMG + ZIP)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Remove cpu-features (incompatible with Electron 42 V8)
        run: rm -rf node_modules/cpu-features

      - name: Build renderer
        run: npm run build:renderer

      - name: Package macOS
        run: npx electron-builder --mac --publish=never

      - name: Upload macOS artifacts
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          files: |
            dist-app/*.dmg
            dist-app/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
